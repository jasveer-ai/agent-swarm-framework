[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-swarm-framework"
version = "0.1.0"
description = "A modular, fractal, and object-oriented agent orchestration framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
]

[project.scripts]
swarm = "swarm:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
py-modules = ["swarm"]
